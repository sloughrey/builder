# Starter CI for the structured workflow. Created once by /structured:workflow-init and then
# owned by this project: add your own lint, typecheck, test and build steps.
name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so the secrets scan can check every commit in the PR.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The docs check and secrets scan are vendored into .github/workflow-scripts/ by
      # /structured:workflow-init (no dependencies), so CI doesn't need access to the plugin.
      - name: Check docs are in sync with the code
        run: node .github/workflow-scripts/docs-check.mjs

      # Fails when the PR adds likely secrets or personal data, including in commits that a
      # later commit reverted. False positives: see secretsScan in .claude/workflow.json.
      - name: Scan for secrets and personal data
        if: github.event_name == 'pull_request'
        run: node .github/workflow-scripts/secrets-scan.mjs --base "origin/${{ github.base_ref }}" --history

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...
      - name: Build for WASM
        run: GOOS=js GOARCH=wasm go build ./...
